{% extends 'base.html' %}
{% load widget_tweaks %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body p-4">
  <h4 class="mb-3 text-center">Change Password</h4>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field|add_class:"form-control" }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-brand w-100">Update Password</button>
  </form>
</div></div></div></div>
{% endblock %}
